[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beast-battery-estimation-architecture-simulation-toolkit"
version = "0.2.0"
description = "A Python framework for battery modelling, state estimation, and parameter estimation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23"
]

[project.optional-dependencies]
test = ["pytest>=7"]
docs = ["pdoc>=14"]

[project.scripts]
beast = "beast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.package-data]
beast = ["py.typed"]
